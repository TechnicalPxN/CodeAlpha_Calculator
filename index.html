<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modern Calculator</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#667eea,#764ba2);

}

/* calculator */

.calculator{

background:rgba(255,255,255,0.15);

padding:25px;

border-radius:15px;

backdrop-filter:blur(10px);

box-shadow:0 10px 30px rgba(0,0,0,0.3);

}

#display{

width:100%;
height:60px;

border:none;
border-radius:10px;

margin-bottom:15px;

font-size:24px;

text-align:right;

padding:10px;

}

/* buttons */

.buttons{

display:grid;
grid-template-columns:repeat(4,70px);
gap:12px;

}

button{

height:60px;

border:none;

border-radius:10px;

font-size:18px;

cursor:pointer;

background:white;

transition:0.2s;

}

button:hover{

transform:scale(1.05);

box-shadow:0 5px 15px rgba(0,0,0,0.2);

}

.operator{

background:#e2e8f0;

}

.equal{

grid-column:span 2;

background:#4f46e5;

color:white;

}

/* footer */

footer{

margin-top:30px;
color:white;
font-size:14px;

}

</style>

</head>

<body>

<div class="calculator">

<input type="text" id="display" readonly>

<div class="buttons">

<button class="operator">C</button>
<button class="operator">DEL</button>
<button class="operator">%</button>
<button class="operator">/</button>

<button>7</button>
<button>8</button>
<button>9</button>
<button class="operator">*</button>

<button>4</button>
<button>5</button>
<button>6</button>
<button class="operator">-</button>

<button>1</button>
<button>2</button>
<button>3</button>
<button class="operator">+</button>

<button>0</button>
<button>.</button>
<button class="equal">=</button>

</div>

</div>

<footer>
Developed by Bhagwat
</footer>

<script>

const display=document.getElementById("display")

const buttons=document.querySelectorAll("button")

buttons.forEach(btn=>{

btn.addEventListener("click",()=>{

let value=btn.textContent

if(value==="C"){
display.value=""
}

else if(value==="DEL"){
display.value=display.value.slice(0,-1)
}

else if(value==="="){

try{
display.value=eval(display.value)
}
catch{
display.value="Error"
}

}

else{

display.value+=value

}

})

})

/* keyboard support */

document.addEventListener("keydown",e=>{

if("0123456789+-*/.%".includes(e.key)){
display.value+=e.key
}

if(e.key==="Enter"){
display.value=eval(display.value)
}

if(e.key==="Backspace"){
display.value=display.value.slice(0,-1)
}

})

</script>

</body>

</html>
